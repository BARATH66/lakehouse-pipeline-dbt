version: 2

models:
  - name: dim_customer
    description: One row per customer with descriptive attributes and subscribed services.
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: fct_customer_churn
    description: One row per customer with churn status, lifetime value and segment columns. Feeds the BI tiers.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: tenure_band
        tests:
          - accepted_values:
              arguments:
                values: ['0-12 months', '13-24 months', '25-48 months', '49-72 months']
      - name: is_churned
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: ltv
        description: Total billed to date. Based on synthetic monthly billing.
        tests: [not_null]
